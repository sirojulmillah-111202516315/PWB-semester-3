<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak</title>
    <style>
        nav a { margin-right: 20px; }

        form { max-width: 500px; }
        
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button[type="submit"] {
            padding: 6px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <nav aria-label="Navigasi Utama">
            <a href="home.html">home</a>
            <a href="gallery.html">gallery</a>
            <a href="kontak.html">kontak</a>
        </nav>
        <h1>Kontak</h1>
    </header>

    <main>
        <section aria-labelledby="heading-buku-tamu">
            <h2 id="heading-buku-tamu">Buku Tamu</h2>
            <p>Silahkan isi form berikut untuk memberikan pesan atau kesan Anda</p>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="nama">Nama*</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama anda" required>
                </div>

                <div class="form-group">
                    <label for="email">Email*</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan email anda" required>
                </div>

                <div class="form-group">
                    <label for="pesan">Pesan*</label>
                    <textarea id="pesan" name="pesan" placeholder="Tulis pesan atau kesan anda di sini" required></textarea>
                </div>

                <button type="submit">Kirim</button>
            </form>
        </section>
    </main>
</body>
</html>
